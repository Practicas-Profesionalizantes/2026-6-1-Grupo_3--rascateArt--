services:
  - type: web
    name: rascate-art
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    disk:
      name: rascate-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: JWT_SECRET
        generateValue: true
      - key: PUBLIC_URL
        sync: false
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: MP_ACCESS_TOKEN
        sync: false
      - key: MP_WEBHOOK_SECRET
        sync: false
      - key: SHIPPING_COST
        value: "0"
      - key: FREE_SHIPPING_FROM
        value: "0"
